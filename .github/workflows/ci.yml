name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: run tests
        run: python -m unittest discover -s tests -v
      - name: check cli entry point
        run: python -m gitspidy --help

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check version change
        id: check
        shell: bash
        run: |
          version=$(python -c 'from gitspidy import __version__; print(__version__)')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          previous_tag=$(git tag --sort=-version:refname | head -n 1)
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "${previous_tag}" ]]; then
            previous_version=$(git show "${previous_tag}:gitspidy/__init__.py" 2>/dev/null | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_version=$(git show HEAD^:gitspidy/__init__.py 2>/dev/null | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          fi
          if [[ "${previous_version:-}" == "${version}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: gitspidy-linux-x86_64
          - os: windows-latest
            artifact: gitspidy-windows-x86_64
          - os: macos-latest
            artifact: gitspidy-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: install build tools
        run: python -m pip install pyinstaller==6.22.3
      - name: install linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb xauth
      - name: build binary
        run: python -m PyInstaller --onefile --name gitspidy --paths . gitspidy/__main__.py
      - name: build GUI binary
        run: >-
          python -m PyInstaller --onefile --windowed --name gitspidy-gui
          --paths . gitspidy/gui_main.py
      - name: smoke test binary
        if: runner.os != 'Linux'
        run: ./dist/gitspidy --help
      - name: smoke test linux binary
        if: runner.os == 'Linux'
        run: |
          ./dist/gitspidy --help
          ./dist/gitspidy scan .
          xvfb-run -a ./dist/gitspidy-gui . &
          pid=$!
          sleep 3
          kill "$pid" || true
      - name: package binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist gitspidy.exe gitspidy-gui.exe
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist gitspidy gitspidy-gui
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: prepare checksums and changelog
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          find artifacts -type f -name '*.tar.gz' -exec cp {} . \;
          sha256sum *.tar.gz > SHA256SUMS
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            git log --format='- %s (%h)' "${PREVIOUS_TAG}..HEAD" > RELEASE_NOTES.md
          else
            git log --format='- %s (%h)' HEAD > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md || echo '- initial release' > RELEASE_NOTES.md
      - name: create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          gh release create "${tag}" *.tar.gz SHA256SUMS \
            --title "GitSpidy ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
